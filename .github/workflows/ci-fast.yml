name: Fast checks
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: fast-${{ inputs.ref && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: lean_test_runner
          POSTGRES_USER: lean_test
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lean_test -d lean_test_runner"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      PG_TEST_HOST: 127.0.0.1
      PG_TEST_USER: lean_test
      PG_TEST_PASSWORD: isolated-ci-only
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.ref || github.ref }}'}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python run_all_tests.py --stage backend
      - run: python -m unittest discover -s scripts/tests -p test_ops_check.py
      - run: python -m unittest discover -s scripts/tests -p test_ci_workflows.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.ref || github.ref }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run typecheck && npm run test && npm run build
