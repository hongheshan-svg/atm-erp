name: Installer validation
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
concurrency:
  group: installers-${{ inputs.ref && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  platform:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.ref || github.ref }}'}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      - run: python -m unittest discover -s scripts/tests -p test_native_install.py
      - run: python -m unittest discover -s scripts/tests -p test_native_service.py
      - run: python -m unittest discover -s scripts/tests -p test_direct_compose.py
      - if: runner.os == 'Linux'
        run: python -m unittest discover -s scripts/tests -p test_container_ota.py
      - run: python -m unittest discover -s scripts/tests -p test_ota_service.py
      - run: python -m unittest discover -s scripts/tests -p test_release_install.py
      - run: python -m unittest discover -s scripts/tests -p test_network_check.py
      - run: python scripts/ci/build_native_wheels.py --platform "$PLATFORM" --output wheels
        shell: bash
        env: {PLATFORM: '${{ runner.os == ''Linux'' && ''linux'' || runner.os == ''macOS'' && ''macos'' || ''windows'' }}'}
      # 在全新虚拟环境中只用刚生成的 wheelhouse 离线安装运行时依赖、pip check 并导入 django/daphne/psycopg2/redis，
      # 与用户安装路径一致；不再从 PyPI 另装一遍做同样的导入检查。
      - run: python scripts/ci/verify_native_wheels.py --wheels "wheels/$PLATFORM"
        shell: bash
        env: {PLATFORM: '${{ runner.os == ''Linux'' && ''linux'' || runner.os == ''macOS'' && ''macos'' || ''windows'' }}'}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHON = (Get-Command python).Source
          ./install-native.ps1 configure -Config (Join-Path $env:RUNNER_TEMP 'native-config.json')
          ./scripts/tests/install.ps1
      - if: runner.os != 'Windows'
        run: |
          # bash -n 只检查第一个文件，后面的会被当作它的参数，必须逐个检查。
          for script in install.sh install-native.sh scripts/*.sh scripts/tests/*.sh; do bash -n "$script"; done
          PYTHON=python bash install-native.sh configure --config "$RUNNER_TEMP/native-config.json"
  # 发布包另含 Linux aarch64 与 macOS Intel 的 wheelhouse；verify_native_wheels 只能检查运行器自身的架构，
  # 因此在对应架构的运行器上同样离线安装、pip check 并导入。
  wheel-architectures:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, arch: aarch64, runner: ubuntu-24.04-arm}
          - {platform: macos, arch: x86_64, runner: macos-15-intel}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.ref || github.ref }}'}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      # 运行器若不是目标架构，这一任务只会重复检查已覆盖的 wheelhouse，直接失败。
      - run: test "$(python -c 'import platform; print(platform.machine().lower())')" = "$ARCH"
        shell: bash
        env: {ARCH: '${{ matrix.arch }}'}
      - run: python scripts/ci/build_native_wheels.py --platform "$PLATFORM" --output wheels
        shell: bash
        env: {PLATFORM: '${{ matrix.platform }}'}
      - run: python scripts/ci/verify_native_wheels.py --wheels "wheels/$PLATFORM"
        shell: bash
        env: {PLATFORM: '${{ matrix.platform }}'}
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: atm_erp_lean
          POSTGRES_USER: atm_erp_lean
          POSTGRES_PASSWORD: native-ci-only
        ports: ['18432:5432']
        options: >-
          --health-cmd "pg_isready -U atm_erp_lean -d atm_erp_lean"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['18479:6379']
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.ref || github.ref }}'}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/constraints.txt
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: frontend
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Current revision installation and repeat installation
        env:
          NATIVE_SMOKE_DB_PASSWORD: native-ci-only
        # 显式 bash 才带 pipefail：git archive 失败时 tar 可能解出不完整的源码树却不报错。
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/native"
          cp -R frontend/dist "$RUNNER_TEMP/native/frontend/dist"
          python scripts/tests/native_smoke.py "$RUNNER_TEMP/native" --db-port 18432 --redis-port 18479
