name: Platform release installers
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/native_install.py'
      - 'scripts/package_release.py'
      - 'scripts/tests/*native*'
      - 'install-native.*'
      - '.github/workflows/release-installers.yml'
  push:
    branches: ['codex/cross-platform-release-installers']
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m unittest discover -s scripts/tests -p test_native_install.py
      - run: python -m pip install -r backend/requirements.txt
      - run: python -c "import daphne, psycopg2, redis; print('Native dependencies import successfully')"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PYTHON = (Get-Command python).Source
          ./install-native.ps1 configure -Config (Join-Path $env:RUNNER_TEMP 'native-config.json')
          ./scripts/tests/install.ps1
      - if: runner.os != 'Windows'
        run: |
          bash -n install.sh install-native.sh
          PYTHON=python bash install-native.sh configure --config "$RUNNER_TEMP/native-config.json"
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: |
          python scripts/package_release.py v1.0.0 --output dist/releases
          python scripts/package_release.py v1.1.0 --output dist/releases
      - run: sudo apt-get update && sudo apt-get install -y nginx
      - name: Isolated dependency services
        run: |
          docker run -d --name native-release-pg -e POSTGRES_DB=atm_erp_lean -e POSTGRES_USER=atm_erp_lean -e POSTGRES_PASSWORD=native-ci-only -p 127.0.0.1:18432:5432 postgres:15-alpine
          docker run -d --name native-release-redis -p 127.0.0.1:18479:6379 redis:7-alpine
          for i in $(seq 1 30); do docker exec native-release-pg pg_isready -U atm_erp_lean && break; sleep 2; done
      - name: Native v1.0.0 installation and repeat installation
        env: {NATIVE_SMOKE_DB_PASSWORD: native-ci-only}
        run: |
          unzip -q dist/releases/atm-erp-v1.0.0-linux-native.zip -d "$RUNNER_TEMP/native packages"
          python scripts/tests/native_smoke.py "$RUNNER_TEMP/native packages/atm-erp-v1.0.0-linux-native" --db-port 18432 --redis-port 18479
      - name: Independent database for v1.1.0
        run: |
          docker rm -f native-release-pg native-release-redis
          docker run -d --name native-release-pg -e POSTGRES_DB=atm_erp_lean -e POSTGRES_USER=atm_erp_lean -e POSTGRES_PASSWORD=native-ci-only -p 127.0.0.1:18432:5432 postgres:15-alpine
          docker run -d --name native-release-redis -p 127.0.0.1:18479:6379 redis:7-alpine
          for i in $(seq 1 30); do docker exec native-release-pg pg_isready -U atm_erp_lean && break; sleep 2; done
      - name: Native v1.1.0 installation and repeat installation
        env: {NATIVE_SMOKE_DB_PASSWORD: native-ci-only}
        run: |
          unzip -q dist/releases/atm-erp-v1.1.0-linux-native.zip -d "$RUNNER_TEMP/native packages"
          python scripts/tests/native_smoke.py "$RUNNER_TEMP/native packages/atm-erp-v1.1.0-linux-native" --db-port 18432 --redis-port 18479
      - uses: actions/upload-artifact@v4
        with: {name: release-installers, path: dist/releases, retention-days: 14}
      - if: always()
        run: docker rm -f native-release-pg native-release-redis || true
