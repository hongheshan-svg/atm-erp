name: Browser validation
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      projects:
        type: string
        default: both
      matrix:
        description: 'select_suites 生成的分片列表：[{project, shard, shards, specs}]'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: browser-${{ inputs.ref && github.run_id || github.ref }}-${{ inputs.projects || 'both' }}
  cancel-in-progress: true
jobs:
  browser:
    name: browser (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    # 每片是一套独立安装：自己的数据库、首次安装向导和账号。单片用例约 4 分钟，加环境准备约 7 分钟；
    # 超时留出余量，避免用例增长后被误判失败。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    env:
      LEAN_PROJECT_NAME: lean-ci-${{ matrix.project }}
      LEAN_IMAGE: lean-ci-browser:local
      LEAN_HTTP_PORT: '18320'
      LEAN_ENVIRONMENT: development
      LEAN_ADMIN_PASSWORD: Lean-CI-only-password-2026
      E2E_BASE_URL: http://127.0.0.1:18320
      E2E_ADMIN_PASSWORD: Lean-CI-only-password-2026
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.ref || github.ref }}'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: frontend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          load: true
          tags: lean-ci-browser:local
          # 只读：依赖层由 main 上的 ci-cache.yml 写入。分片各自导出缓存既互相争写，每次还要多花近一分钟。
          cache-from: type=gha,scope=app-image
      - run: bash install.sh --skip-build --no-ota
      - name: First-install wizard
        run: npm run test:e2e -- e2e/setup.spec.ts --project="$PROJECT" --grep '全新安装' --output=test-results-first-install
        working-directory: frontend
        env:
          PROJECT: ${{ matrix.project }}
          E2E_FIRST_INSTALL: '1'
          E2E_SETUP_NEW_PASSWORD: Lean-CI-ready-password-2026
      - run: python3 -m scripts.ci.run_selected browser --project="$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}
          TEST_TARGETS: ${{ matrix.specs }}
          E2E_ADMIN_PASSWORD: Lean-CI-ready-password-2026
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.project }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            frontend/test-results
            frontend/test-results-first-install
          retention-days: 7
      - if: always()
        run: |
          if [[ -f .env ]]; then docker compose --env-file .env down -v;
          elif [[ -f .env.lean ]]; then docker compose --env-file .env.lean down -v; fi
