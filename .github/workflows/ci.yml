name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'
  DJANGO_SETTINGS_MODULE: config.settings
  SECRET_KEY: ci-only-secret-not-for-production-0123456789abcdef0123456789abcdef
  DEBUG: 'False'
  DB_NAME: erp_db
  DB_USER: erp_user
  DB_PASSWORD: erp_password
  DB_HOST: localhost
  DB_PORT: '5432'
  REDIS_URL: redis://localhost:6379/0
  REDIS_HOST: localhost

jobs:
  backend-preflight:
    name: Backend / preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: erp_db
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    outputs:
      test-matrix: ${{ steps.backend-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          ruff check . ../scripts/ci
          ruff format --check . ../scripts/ci
      - name: Validate backend module coverage
        id: backend-matrix
        run: python ../scripts/ci/backend_test_matrix.py --github-output "$GITHUB_OUTPUT"
      - name: Django deployment checks
        run: python -W error::DeprecationWarning manage.py check --deploy
        env:
          SECURE_SSL_REDIRECT: 'True'
          SECURE_HSTS_SECONDS: '31536000'
          SECURE_HSTS_INCLUDE_SUBDOMAINS: 'True'
          SECURE_HSTS_PRELOAD: 'True'
          SESSION_COOKIE_SECURE: 'True'
          CSRF_COOKIE_SECURE: 'True'
      - name: OpenAPI schema validation
        run: python -W error::DeprecationWarning manage.py spectacular --file /tmp/schema.yml --validate --fail-on-warn
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

  backend-tests:
    name: Backend / ${{ matrix.name }}
    needs: backend-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.backend-preflight.outputs.test-matrix) }}
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: erp_db
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run module group
        env:
          DJANGO_TEST_TARGETS: ${{ matrix.targets }}
        run: |
          IFS=',' read -ra test_targets <<< "$DJANGO_TEST_TARGETS"
          python -W error::DeprecationWarning manage.py test --noinput "${test_targets[@]}"

  integration-tests:
    name: Backend / integration
    needs: backend-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: erp_db
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run integration tests
        run: pytest tests/integration -v --tb=short -W error::DeprecationWarning

  frontend:
    name: Frontend / quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build

  browser-e2e:
    name: Frontend / browser E2E
    needs: [backend-preflight, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: erp_db
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      E2E_USERNAME: admin
      E2E_PASSWORD: ci-e2e-password
      E2E_BASE_URL: http://127.0.0.1:3000
      VITE_API_BASE_URL: http://127.0.0.1:8000
      VITE_WS_BASE_URL: ws://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Chromium
        working-directory: frontend
        run: |
          npx playwright install-deps chromium
          if [[ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]]; then
            npx playwright install chromium
          fi
      - name: Bootstrap E2E database
        run: python scripts/ci/bootstrap_e2e.py
      - name: Start application
        run: |
          cd backend
          nohup daphne -b 127.0.0.1 -p 8000 config.asgi:application > /tmp/daphne.log 2>&1 &
          cd ../frontend
          nohup npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8000/api/v1/health/
          curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:3000/erp/login
      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-diagnostics
          if-no-files-found: ignore
          path: |
            /tmp/daphne.log
            /tmp/vite.log
            frontend/test-results
            frontend/playwright-report

  dependency-audit:
    name: Dependencies / ${{ matrix.ecosystem }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [python, node]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        if: matrix.ecosystem == 'python'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        if: matrix.ecosystem == 'node'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Python dependencies
        if: matrix.ecosystem == 'python'
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt
      - name: Audit Node dependencies
        if: matrix.ecosystem == 'node'
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high --registry=https://registry.npmjs.org

  compose-validate:
    name: Containers / Compose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose variants
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.expose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.linux-host.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml \
            -f docker-compose.expose.yml -f docker-compose.linux-host.yml config --quiet

  container-build:
    name: Containers / ${{ matrix.name }}
    needs: compose-validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: application image
            dockerfile: docker/app/Dockerfile
            cache-scope: ci-app
          - name: updater image
            dockerfile: docker/updater/Dockerfile
            cache-scope: ci-updater
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.cache-scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache-scope }}

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - backend-preflight
      - backend-tests
      - integration-tests
      - frontend
      - browser-e2e
      - dependency-audit
      - compose-validate
      - container-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_PREFLIGHT_RESULT: ${{ needs.backend-preflight.result }}
      BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
      INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
      FRONTEND_RESULT: ${{ needs.frontend.result }}
      BROWSER_E2E_RESULT: ${{ needs.browser-e2e.result }}
      DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
      COMPOSE_VALIDATE_RESULT: ${{ needs.compose-validate.result }}
      CONTAINER_BUILD_RESULT: ${{ needs.container-build.result }}
    steps:
      - name: Verify required CI stages
        run: |
          failed=0
          check_stage() {
            local stage="$1"
            local result="$2"
            printf '%-28s %s\n' "$stage" "$result"
            if [[ "$result" != "success" ]]; then
              failed=1
            fi
          }

          check_stage "Backend preflight" "$BACKEND_PREFLIGHT_RESULT"
          check_stage "Backend module tests" "$BACKEND_TESTS_RESULT"
          check_stage "Integration tests" "$INTEGRATION_TESTS_RESULT"
          check_stage "Frontend quality" "$FRONTEND_RESULT"
          check_stage "Browser E2E" "$BROWSER_E2E_RESULT"
          check_stage "Dependency audit" "$DEPENDENCY_AUDIT_RESULT"
          check_stage "Compose validation" "$COMPOSE_VALIDATE_RESULT"
          check_stage "Container builds" "$CONTAINER_BUILD_RESULT"

          if [[ "$failed" -ne 0 ]]; then
            echo "One or more required CI stages did not succeed."
            exit 1
          fi
          echo "All required CI stages succeeded."
