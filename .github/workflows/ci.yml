name: Lean ERP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  ota-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python scripts/tests/ota_smoke.py
      - run: bash scripts/tests/native-ota-smoke.sh
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: ./scripts/tests/install.ps1
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/precheck-tests.sh --all
      - run: python3 -m unittest discover -s scripts/tests -p test_ops_check.py
      - run: python3 -m unittest discover -s scripts/tests -p test_ota_runner.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm run test && npm run build
  browser:
    runs-on: ubuntu-latest
    env:
      LEAN_PROJECT_NAME: lean-ci
      LEAN_HTTP_PORT: '18320'
      LEAN_ENVIRONMENT: development
      LEAN_ADMIN_PASSWORD: Lean-CI-only-password-2026
      E2E_BASE_URL: http://127.0.0.1:18320
      E2E_ADMIN_PASSWORD: Lean-CI-only-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: bash install.sh
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-evidence, path: frontend/test-results, retention-days: 7}
      - if: always()
        run: docker compose --env-file .env.lean down -v
