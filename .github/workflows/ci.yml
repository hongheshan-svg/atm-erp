name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: erp_db
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp_user" --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-only-secret-not-for-prod
      DEBUG: 'False'
      DB_NAME: erp_db
      DB_USER: erp_user
      DB_PASSWORD: erp_password
      DB_HOST: localhost
      DB_PORT: '5432'
      REDIS_URL: redis://localhost:6379/0
      REDIS_HOST: localhost
      SECURE_SSL_REDIRECT: 'True'
      SECURE_HSTS_SECONDS: '31536000'
      SECURE_HSTS_INCLUDE_SUBDOMAINS: 'True'
      SECURE_HSTS_PRELOAD: 'True'
      SESSION_COOKIE_SECURE: 'True'
      CSRF_COOKIE_SECURE: 'True'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Django deployment checks
        run: python -W error::DeprecationWarning manage.py check --deploy
      - name: OpenAPI schema validation
        run: python -W error::DeprecationWarning manage.py spectacular --file /tmp/schema.yml --validate --fail-on-warn
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Django tests
        run: python -W error::DeprecationWarning manage.py test --noinput
      - name: Integration tests
        run: pytest tests/integration -v --tb=short
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit
      - name: Dependency audit
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build

  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose variants
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.build.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.expose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.linux-host.yml config --quiet
      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build updater image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/updater/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
