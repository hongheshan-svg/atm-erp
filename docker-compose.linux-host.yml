# 可选（仅 Linux）：允许全合一 app 通过 host.docker.internal 访问宿主机设备。
# 用法: docker compose -f docker-compose.yml -f docker-compose.linux-host.yml up -d
services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"
  redis:
    ports:
      - "127.0.0.1:6380:6379"
  app:
    extra_hosts:
      - "host.docker.internal:host-gateway"
