# 配置与密钥由安装器写入 .env.lean；升级保留项目名和下方数据卷。
# 正式包由安装器锁定 LEAN_IMAGE 摘要，不使用 latest，不在生产现场构建。
name: ${LEAN_PROJECT_NAME:-atm-erp-lean}
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *bounded-logging
    environment:
      POSTGRES_DB: atm_erp_lean
      POSTGRES_USER: atm_erp_lean
      POSTGRES_PASSWORD: ${LEAN_DB_PASSWORD:?Set LEAN_DB_PASSWORD}
    volumes:
      - lean_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U atm_erp_lean -d atm_erp_lean']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *bounded-logging
    command: [redis-server, --save, '', --appendonly, 'no', --maxmemory, 128mb, --maxmemory-policy, allkeys-lru]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    image: ${LEAN_IMAGE:-atm-erp-lean:local}
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    init: true
    logging: *bounded-logging
    ports:
      - '${LEAN_BIND_ADDRESS:-127.0.0.1}:${LEAN_HTTP_PORT:-8080}:8080'
    environment:
      SECRET_KEY: ${LEAN_SECRET_KEY:?Set LEAN_SECRET_KEY}
      ADMIN_PASSWORD: ${LEAN_ADMIN_PASSWORD:-}
      ALLOWED_HOSTS: ${LEAN_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_HOST: postgres
      DB_NAME: atm_erp_lean
      DB_USER: atm_erp_lean
      DB_PASSWORD: ${LEAN_DB_PASSWORD:?Set LEAN_DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /app/uploads
      DEBUG: 'false'
      APP_ENVIRONMENT: ${LEAN_ENVIRONMENT:-production}
      OTA_AGENT_TOKEN: ${LEAN_OTA_AGENT_TOKEN:-}
      OTA_MODE: ${LEAN_OTA_MODE:-container}
    volumes:
      - lean_uploads:/app/uploads
      - lean_runtime:/app/runtime
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8080/api/health/",timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
volumes:
  # 不随镜像替换；禁止用 docker compose down -v 升级或修复服务。
  lean_postgres:
  lean_uploads:
  lean_runtime:
