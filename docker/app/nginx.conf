worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # 请求编号：入站已带安全格式（字母数字 . _ -，不超过 64 位）的 X-Request-ID 时沿用，否则用 Nginx 生成的 $request_id；与后端校验一致。
  map $http_x_request_id $erp_request_id {
    default $request_id;
    "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
  }
  # 保留 combined 原字段，末尾追加请求编号，员工报出的错误编号可直接在访问日志中检索。
  log_format erp_request '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" request_id=$erp_request_id';
  access_log /dev/stdout erp_request;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/nginx/client;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  server {
    listen 8080;
    root /tmp/erp-www;
    client_max_body_size 25m;
    # location 里只要出现 add_header，就不再继承这里的任何 add_header；index.html 的 location 必须整组重复。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    location = / { return 302 /erp/; }
    location = /erp { return 301 /erp/; }
    location = /erp/index.html {
      add_header Cache-Control 'no-cache';
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy same-origin always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
    location /erp/assets/ { try_files $uri =404; expires 1y; }
    location /erp/ { try_files $uri $uri/ /erp/index.html; }
    location /api/ {
      proxy_pass http://127.0.0.1:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Request-ID $erp_request_id;
      proxy_read_timeout 60;
    }
    location / { return 404; }
  }
}
